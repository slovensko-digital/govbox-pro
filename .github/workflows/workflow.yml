name: Push CI

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  brakeman:
    name: Brakeman

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: bundle exec brakeman

  test:
    name: Run tests

    runs-on: ubuntu-latest

    env:
      PGHOST: localhost
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Puppeteer, used by Grover for PDF rendering, is a runtime dependency with no
      # asset pipeline hook installing it anymore now that assets are served via importmap.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: bundle exec rails db:setup --trace
      # Includes integration tests; system tests run separately below.
      - run: bundle exec rails test
      - run: bundle exec rails test:system
      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: screenshots.zip
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
      - name: Keep test log from failed tests
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-log
          path: ${{ github.workspace }}/log/test.log
          if-no-files-found: ignore

  fop:
    name: FOP Saxon check

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            fop:
              - Dockerfile
              - bin/check-fop-saxon
      - name: Build the image's FOP stage
        if: steps.changes.outputs.fop == 'true'
        run: docker build --target base -t govbox-pro-base .
