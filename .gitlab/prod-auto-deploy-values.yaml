timeout: 120
service:
  externalPort: 3000
  internalPort: 3000
image:
  secrets:
  - name: skdigital-bonet-registry
ingress:
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 256m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
livenessProbe:
  initialDelaySeconds: 5
  timeoutSeconds: 5
  probeType: "httpGet"
  path: "/health"
readinessProbe:
  initialDelaySeconds: 5
  timeoutSeconds: 10
  probeType: "httpGet"
  path: "/health"
resources:
  requests:
    cpu: 250m
    memory: 1200Mi
  limits:
    memory: 1500Mi
persistence:
  enabled: true
  volumes:
  - name: govbox-pro-storage
    mount:
      path: /app/storage
    claim:
      accessMode: ReadWriteMany
      size: 10Gi
      storageClass: nfs-client
workers:
  worker:
    replicaCount: "1"
    # the chart mounts persistence volumes only into the web deployment, the claim is <release>-auto-deploy-<volume name>
    extraVolumes:
    - name: govbox-pro-storage
      persistentVolumeClaim:
        claimName: govbox-pro-auto-deploy-govbox-pro-storage
    extraVolumeMounts:
    - name: govbox-pro-storage
      mountPath: /app/storage
    # command replaces the image ENTRYPOINT, so start tini here to reap zombie Chromium processes
    command: ["/usr/bin/tini", "--", "bundle", "exec", "good_job", "start"]
    startupProbe:
      probeType: "httpGet"
      path: "/status/started"
    livenessProbe:
      probeType: "httpGet"
      path: "/status/connected"
    readinessProbe:
      probeType: "httpGet"
      path: "/status/started"
    resources:
      requests:
        cpu: 1
        memory: 3Gi
      limits:
        memory: 3Gi
